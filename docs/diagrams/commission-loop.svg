<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" font-size="13">
  <title>Cast as many sigils as your hand allows, then end the term and mud acts</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .edge { stroke: #9b988f; fill: none; stroke-width: 1.25; }
    .edge-fill { fill: #9b988f; }
    .ink { fill: #1f1e1b; }
    .quiet { fill: #5f5e5a; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #7d7a72; }
      .edge-fill { fill: #7d7a72; }
      .ink { fill: #ece9e1; }
      .quiet { fill: #a9a69d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="edge-fill"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Cast as many sigils as your hand allows, then end the term and mud acts</text>
  <g class="edge">
    <path d="M188 200H216" marker-end="url(#arrow)"/>
    <path d="M366 200H394" marker-end="url(#arrow)"/>
    <path d="M544 200H572" marker-end="url(#arrow)"/>
    <path d="M469 228V262H291V228" marker-end="url(#arrow)"/>
    <path d="M469 172V120" marker-end="url(#arrow)"/>
    <path d="M379 92H113V172" marker-end="url(#arrow)"/>
    <path d="M647 228V302" marker-end="url(#arrow)"/>
    <path d="M572 330H113V228" marker-end="url(#arrow)"/>
  </g>
  <rect x="38" y="172" width="150" height="56" rx="8" class="edge"/>
  <text x="113" y="196" text-anchor="middle" font-weight="600" class="ink">Reveal and draw</text>
  <text x="113" y="214" text-anchor="middle" font-size="11.5" class="quiet">move, then 6 runes</text>
  <rect x="216" y="172" width="150" height="56" rx="8" class="edge"/>
  <text x="291" y="196" text-anchor="middle" font-weight="600" class="ink">Compose sigil</text>
  <text x="291" y="214" text-anchor="middle" font-size="11.5" class="quiet">anchor plus joins</text>
  <rect x="394" y="172" width="150" height="56" rx="8" class="edge"/>
  <text x="469" y="196" text-anchor="middle" font-weight="600" class="ink">Cast</text>
  <text x="469" y="214" text-anchor="middle" font-size="11.5" class="quiet">resolves at once</text>
  <rect x="572" y="172" width="150" height="56" rx="8" class="edge"/>
  <text x="647" y="196" text-anchor="middle" font-weight="600" class="ink">End term</text>
  <text x="647" y="214" text-anchor="middle" font-size="11.5" class="quiet">Ward adds up</text>
  <rect x="379" y="64" width="180" height="56" rx="8" class="edge"/>
  <text x="469" y="88" text-anchor="middle" font-weight="600" class="ink">Rewards and workshop</text>
  <text x="469" y="106" text-anchor="middle" font-size="11.5" class="quiet">currency and motes</text>
  <rect x="572" y="302" width="150" height="56" rx="8" class="edge"/>
  <text x="647" y="326" text-anchor="middle" font-weight="600" class="ink">Mud acts</text>
  <text x="647" y="344" text-anchor="middle" font-size="11.5" class="quiet">Ward absorbs flares</text>
  <text x="380" y="254" text-anchor="middle" font-size="11.5" class="quiet">cast another</text>
  <text x="479" y="150" font-size="11.5" class="quiet">makes clay</text>
  <text x="246" y="84" text-anchor="middle" font-size="11.5" class="quiet">next commission</text>
  <text x="342" y="322" text-anchor="middle" font-size="11.5" class="quiet">next term</text>
</svg>
