<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" font-size="13">
  <title>Each term the commission reveals its move, you compose and cast, then it acts</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .edge { stroke: #9b988f; fill: none; stroke-width: 1.25; }
    .edge-fill { fill: #9b988f; }
    .ink { fill: #1f1e1b; }
    .quiet { fill: #5f5e5a; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #7d7a72; }
      .edge-fill { fill: #7d7a72; }
      .ink { fill: #ece9e1; }
      .quiet { fill: #a9a69d; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="edge-fill"/>
    </marker>
  </defs>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Each term the commission reveals its move, you compose and cast, then it acts</text>
  <g class="edge">
    <path d="M188 120H216" marker-end="url(#arrow)"/>
    <path d="M366 120H394" marker-end="url(#arrow)"/>
    <path d="M544 120H572" marker-end="url(#arrow)"/>
    <path d="M647 148V214" marker-end="url(#arrow)"/>
    <path d="M587 250H150V148" marker-end="url(#arrow)"/>
    <path d="M647 286V332" marker-end="url(#arrow)"/>
    <path d="M540 360H76V148" marker-end="url(#arrow)"/>
  </g>
  <rect x="38" y="92" width="150" height="56" rx="8" class="edge"/>
  <text x="113" y="116" text-anchor="middle" font-weight="600" class="ink">Reveal and draw</text>
  <text x="113" y="134" text-anchor="middle" font-size="11.5" class="quiet">action, then hand</text>
  <rect x="216" y="92" width="150" height="56" rx="8" class="edge"/>
  <text x="291" y="116" text-anchor="middle" font-weight="600" class="ink">Compose rune</text>
  <text x="291" y="134" text-anchor="middle" font-size="11.5" class="quiet">anchor plus joins</text>
  <rect x="394" y="92" width="150" height="56" rx="8" class="edge"/>
  <text x="469" y="116" text-anchor="middle" font-weight="600" class="ink">Cast</text>
  <text x="469" y="134" text-anchor="middle" font-size="11.5" class="quiet">transmute and ward</text>
  <rect x="572" y="92" width="150" height="56" rx="8" class="edge"/>
  <text x="647" y="116" text-anchor="middle" font-weight="600" class="ink">Commission acts</text>
  <text x="647" y="134" text-anchor="middle" font-size="11.5" class="quiet">Ward absorbs flares</text>
  <polygon points="587,250 647,214 707,250 647,286" class="edge"/>
  <text x="647" y="254" text-anchor="middle" font-weight="600" class="ink">Done?</text>
  <rect x="540" y="332" width="180" height="56" rx="8" class="edge"/>
  <text x="630" y="356" text-anchor="middle" font-weight="600" class="ink">Rewards and workshop</text>
  <text x="630" y="374" text-anchor="middle" font-size="11.5" class="quiet">currency and motes</text>
  <text x="368" y="242" text-anchor="middle" font-size="11.5" class="quiet">no: next term</text>
  <text x="657" y="314" font-size="11.5" class="quiet">yes</text>
  <text x="308" y="352" text-anchor="middle" font-size="11.5" class="quiet">next commission</text>
</svg>
