<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" font-size="13">
  <title>One circle shows the whole constitution: share of mass and grade</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .vessel { stroke: #9b988f; fill: none; stroke-width: 1; stroke-dasharray: 4 4; }
    .grid { stroke: #dedbd2; fill: none; stroke-width: 1; }
    .earth { fill: #d85a30; fill-opacity: 0.35; stroke: #d85a30; stroke-width: 1.25; }
    .water { fill: #378add; fill-opacity: 0.35; stroke: #378add; stroke-width: 1.25; }
    .ink { fill: #1f1e1b; }
    .quiet { fill: #5f5e5a; }
    @media (prefers-color-scheme: dark) {
      .vessel { stroke: #7d7a72; }
      .grid { stroke: #3d3b37; }
      .ink { fill: #ece9e1; }
      .quiet { fill: #a9a69d; }
    }
  </style>
  <text x="24" y="30" font-size="15" font-weight="600" class="ink">One circle shows the whole constitution: share of mass and grade</text>

  <circle cx="150" cy="150" r="90" class="vessel"/>
  <circle cx="150" cy="150" r="63" class="grid"/>
  <circle cx="150" cy="150" r="40" class="grid"/>
  <path d="M150 150L150 60A90 90 0 0 1 150 240Z" class="water"/>
  <path d="M150 150L150 213A63 63 0 0 1 150 87Z" class="earth"/>
  <text x="150" y="272" text-anchor="middle" font-weight="600" class="ink">Mud</text>
  <text x="150" y="290" text-anchor="middle" font-size="11.5" class="quiet">medium earth, weak water</text>

  <circle cx="380" cy="150" r="90" class="vessel"/>
  <circle cx="380" cy="150" r="63" class="grid"/>
  <circle cx="380" cy="150" r="40" class="grid"/>
  <path d="M380 150L380 60A90 90 0 0 1 460 108.9Z" class="water"/>
  <path d="M380 150L460 108.9A90 90 0 0 1 424 228.5Z" class="earth"/>
  <path d="M380 150L410.8 204.9A63 63 0 1 1 380 87Z" class="earth"/>
  <text x="380" y="272" text-anchor="middle" font-weight="600" class="ink">Clay</text>
  <text x="380" y="290" text-anchor="middle" font-size="11.5" class="quiet">two earth pools, weak water</text>

  <circle cx="610" cy="150" r="90" class="vessel"/>
  <circle cx="610" cy="150" r="63" class="grid"/>
  <circle cx="610" cy="150" r="40" class="earth"/>
  <text x="610" y="272" text-anchor="middle" font-weight="600" class="ink">Steel</text>
  <text x="610" y="290" text-anchor="middle" font-size="11.5" class="quiet">heavy earth only</text>

  <text x="380" y="330" text-anchor="middle" font-size="11.5" class="quiet">Wedge width: share of mass. Rings, outside in: weak, medium, heavy.</text>
  <rect x="300" y="346" width="12" height="12" rx="2" class="earth"/>
  <text x="318" y="357" font-size="11.5" class="ink">Earth</text>
  <rect x="400" y="346" width="12" height="12" rx="2" class="water"/>
  <text x="418" y="357" font-size="11.5" class="ink">Water</text>
</svg>
